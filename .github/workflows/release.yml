# A ogni tag "v…" (es. v1.0.1) costruisce Linux (.deb), Windows (.exe) e macOS (.app in .zip)
# e li allega alla Release di GitHub.
name: Pacchetti
on:
  push:
    tags: ["v*"]
  workflow_dispatch:   # prova manuale dalla scheda Actions (senza pubblicare la Release)
permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sh packaging/build-deb.sh "${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v4
        with: {name: linux, path: build/doggo_all.deb}

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pyinstaller==6.11.1 PyQt6==6.7.1 pillow==11.0.0
      - run: pyinstaller --noconfirm --onefile --windowed --name Doggo --icon icon.png --add-data "dog.frag:." --add-data "icon.png:." main.py
      - run: Rename-Item dist/Doggo.exe Doggo-windows.exe
      - uses: actions/upload-artifact@v4
        with: {name: windows, path: dist/Doggo-windows.exe}

  macos:
    runs-on: macos-15   # Apple Silicon (macos-14 non è più disponibile)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pyinstaller==6.11.1 PyQt6==6.7.1 pillow==11.0.0
      - run: pyinstaller --noconfirm --windowed --name Doggo --icon icon.png --osx-bundle-identifier com.github.gabrigone01.doggo --add-data "dog.frag:." --add-data "icon.png:." main.py
      - run: cd dist && ditto -c -k --keepParent Doggo.app Doggo-macos.zip
      - uses: actions/upload-artifact@v4
        with: {name: macos, path: dist/Doggo-macos.zip}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with: {merge-multiple: true}
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            doggo_all.deb
            Doggo-windows.exe
            Doggo-macos.zip
