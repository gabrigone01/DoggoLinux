# A ogni tag "v…" (es. v1.0.0) costruisce il .deb e lo allega alla Release di GitHub.
name: Pacchetto deb
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sh packaging/build-deb.sh "${GITHUB_REF_NAME}"
      - uses: softprops/action-gh-release@v2
        with:
          files: build/doggo_all.deb
